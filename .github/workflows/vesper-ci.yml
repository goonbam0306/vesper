name: Vesper CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: python -m compileall -q vesper tests
      - name: migration and bootstrap verification
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from vesper.storage import Storage
          with TemporaryDirectory() as directory:
              storage = Storage(Path(directory) / 'vesper.sqlite3')
              storage.migrate()
              assert storage.migration_inventory()
          print('migration/bootstrap verification passed')
          PY
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - run: git diff --check
      - run: test -f docs/VESPER_V1_CLOSURE_SPEC.md
      - run: test -f docs/VESPER_V1_CLOSURE_STATUS.md
      - run: grep -q 'VESPER V1 NOT SEALED\|VESPER V1 SEALED' docs/VESPER_V1_CLOSURE_STATUS.md
      - run: grep -q 'VESPER_V1_CLOSURE_SPEC.md' README.md
      - run: grep -q 'VESPER_V1_CLOSURE_STATUS.md' README.md
