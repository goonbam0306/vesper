name: Vesper CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: git diff --check
      - run: test -f docs/VESPER_V1_CLOSURE_SPEC.md
      - run: test -f docs/VESPER_V1_CLOSURE_STATUS.md
      - run: grep -q 'VESPER V1 NOT SEALED\|VESPER V1 SEALED' docs/VESPER_V1_CLOSURE_STATUS.md
      - run: grep -q 'VESPER_V1_CLOSURE_SPEC.md' README.md
      - run: grep -q 'VESPER_V1_CLOSURE_STATUS.md' README.md
